[project]
name = "stringart-claude"
version = "0.1.0"
description = "String art calculé : de la photo à la séquence de clous, avec un banc d'essai de méthodes d'optimisation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "scipy>=1.14",
    "pillow>=11.0",
    "scikit-image>=0.24",
]

[project.scripts]
stringart-claude = "stringart_claude.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stringart_claude"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    # Le notebook : matplotlib pour les figures, jupytext + nbconvert pour produire le .ipynb
    # exécuté à partir du .py, ipykernel pour l'ouvrir dans l'éditeur.
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbconvert>=7.16",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
